[package]
name = "rust_server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }

tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0.86"

log = "0.4.22"

env_logger = "0.11.3"
clap = { version = "4.6.6", features = ["derive"] }
